name: Build macOS

on:
  push:
    branches: [ "claude/vst3-juce-airwindows-UV4JH", "stable/**", "the-press-demo" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone JUCE
        run: git clone --depth 1 --branch 8.0.12 https://github.com/juce-framework/JUCE.git JUCE

      - name: Generate KnobStripData.h
        run: python3 tools/png_to_header.py Assets/knob_strip.png Source/KnobStripData.h

      - name: Configure
        run: cmake -B build -DJUCE_PATH=JUCE -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Ad-hoc code sign
        run: |
          codesign --force --deep --sign - \
            "build/ThePress_artefacts/Release/VST3/The Press.vst3"
          if [ -d "build/ThePress_artefacts/Release/AU/The Press.component" ]; then
            codesign --force --deep --sign - \
              "build/ThePress_artefacts/Release/AU/The Press.component"
          fi

      - name: Build installer package
        run: |
          # Payload: VST3 goes to /Library/Audio/Plug-Ins/VST3 (system-wide)
          mkdir -p pkg_root/Library/Audio/Plug-Ins/VST3
          cp -r "build/ThePress_artefacts/Release/VST3/The Press DEMO.vst3" \
                "pkg_root/Library/Audio/Plug-Ins/VST3/"

          # AU (optional, may not exist)
          if [ -d "build/ThePress_artefacts/Release/AU/The Press DEMO.component" ]; then
            mkdir -p pkg_root/Library/Audio/Plug-Ins/Components
            cp -r "build/ThePress_artefacts/Release/AU/The Press DEMO.component" \
                  "pkg_root/Library/Audio/Plug-Ins/Components/"
          fi

          # postinstall script: removes Gatekeeper quarantine flag automatically
          mkdir -p pkg_scripts
          cat > pkg_scripts/postinstall << 'EOF'
          #!/bin/bash
          xattr -dr com.apple.quarantine "/Library/Audio/Plug-Ins/VST3/The Press DEMO.vst3" 2>/dev/null || true
          xattr -dr com.apple.quarantine "/Library/Audio/Plug-Ins/Components/The Press DEMO.component" 2>/dev/null || true
          exit 0
          EOF
          chmod +x pkg_scripts/postinstall

          pkgbuild \
            --root pkg_root \
            --scripts pkg_scripts \
            --identifier com.zeus.thepress \
            --version 1.0.0 \
            --install-location / \
            "ThePress-Installer.pkg"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ThePress-Installer-${{ matrix.os }}
          path: ThePress-Installer.pkg
          retention-days: 30
